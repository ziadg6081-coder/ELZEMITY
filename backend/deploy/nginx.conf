# /etc/nginx/sites-available/oriantal-perfumes  (HTTPS via certbot: certbot --nginx -d example.com -d www.example.com)
server {
  listen 80; server_name example.com www.example.com;
  return 301 https://example.com$request_uri;
}
server {
  listen 443 ssl http2; server_name example.com;
  # ssl_certificate / ssl_certificate_key are added by certbot
  client_max_body_size 6m;                       # receipts up to 5 MB

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Socket.IO needs WebSocket upgrade headers
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
